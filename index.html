<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>TimeSync Lite</title>
    
    <!-- iOS Status Bar & App Config -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeSync">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }
        .ios-active-tap:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-100 flex flex-col min-h-screen">

    <!-- Minimalist Header for iPhone -->
    <header class="bg-indigo-950 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-business-time text-xl text-indigo-400"></i>
                <span class="text-lg font-bold tracking-tight">TimeSync</span>
            </div>
            <div class="flex items-center space-x-2 text-right">
                <div>
                    <span class="block text-xs font-semibold" id="header-user-name">กำลังโหลด...</span>
                    <span class="block text-[9px] text-indigo-300">ตอกบัตรผ่าน iPhone</span>
                </div>
                <img class="h-8 w-8 rounded-full border border-indigo-400 bg-indigo-900" src="https://placehold.co/100x100/312e81/ffffff?text=TS" alt="User Profile">
            </div>
        </div>
    </header>

    <!-- Main Content Container (Locked to standard mobile-width for iPhone feeling) -->
    <main class="flex-grow max-w-md w-full mx-auto px-4 py-5 flex flex-col space-y-4">
        
        <!-- Live Clock & Status Card -->
        <div class="bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-6 shadow-xl text-center relative overflow-hidden">
            <div class="absolute right-3 top-3">
                <span class="flex h-2.5 w-2.5 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
            </div>
            
            <p class="text-xs text-indigo-200 tracking-wider uppercase font-medium" id="live-date">...</p>
            <h1 class="text-4xl font-extrabold tracking-tight font-mono my-2 text-white" id="live-time">00:00:00</h1>
            
            <div class="mt-2 inline-flex items-center space-x-1.5 bg-white/10 px-3 py-1 rounded-full text-xs">
                <span class="font-medium">สถานะ:</span>
                <span id="current-status-text" class="font-bold text-amber-300">กำลังตรวจสอบข้อมูล...</span>
            </div>
        </div>

        <!-- Single Action Button Section -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/60 flex flex-col space-y-4">
            <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-slate-500">เลือกกะการทำงาน:</span>
                <select id="shift-select" class="border border-slate-200 rounded-lg px-2 py-1 bg-slate-50 font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="normal">กะปกติ (09:00 - 18:00)</option>
                    <option value="early">กะเช้า (08:00 - 17:00)</option>
                    <option value="late">กะบ่าย (10:00 - 19:00)</option>
                </select>
            </div>

            <!-- Dynamic Easy-Tap Punch Button (Optimized for thumb tapping) -->
            <button id="btn-punch-action" disabled class="w-full h-16 rounded-xl font-bold text-lg flex items-center justify-center space-x-3 transition shadow-md ios-active-tap cursor-not-allowed bg-slate-200 text-slate-400">
                <i id="btn-icon" class="fa-solid fa-spinner fa-spin text-xl"></i>
                <span id="btn-label">กำลังโหลดข้อมูล...</span>
            </button>

            <!-- Compact info badge -->
            <div class="grid grid-cols-2 gap-2 text-center text-[11px] pt-3 border-t border-slate-100">
                <div class="bg-slate-50 p-2 rounded-lg">
                    <span class="block text-slate-400">เช็คอินวันนี้</span>
                    <span class="font-bold text-slate-800" id="today-in-time">-</span>
                </div>
                <div class="bg-slate-50 p-2 rounded-lg">
                    <span class="block text-slate-400">เช็คเอาต์วันนี้</span>
                    <span class="font-bold text-slate-800" id="today-out-time">-</span>
                </div>
            </div>
        </div>

        <!-- Compact KPI stats -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 text-center">
                <span class="block text-[10px] font-semibold text-slate-400">มาทำงาน</span>
                <span class="text-lg font-bold text-slate-800" id="kpi-days">0</span> <span class="text-[10px] text-slate-500">วัน</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 text-center">
                <span class="block text-[10px] font-semibold text-slate-400">ชั่วโมงรวม</span>
                <span class="text-lg font-bold text-slate-800" id="kpi-hours">0.0</span> <span class="text-[10px] text-slate-500">ชม.</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 text-center">
                <span class="block text-[10px] font-semibold text-slate-400">สายสะสม</span>
                <span class="text-lg font-bold text-amber-600" id="kpi-late">0</span> <span class="text-[10px] text-slate-500">ครั้ง</span>
            </div>
        </div>

        <!-- Attendance History List (Perfect for mobile vertically, no overflow-x table) -->
        <div class="flex-grow flex flex-col space-y-2 bg-white rounded-2xl p-4 shadow-sm border border-slate-200/60">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                <h3 class="font-bold text-sm text-slate-800">ประวัติการตอกบัตร</h3>
                <button onclick="exportToCSV()" class="text-xs text-indigo-600 font-bold flex items-center space-x-1 hover:text-indigo-800">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>ส่งออก CSV</span>
                </button>
            </div>

            <!-- Scrollable list items container -->
            <div id="logs-list" class="space-y-2 flex-grow overflow-y-auto max-h-[300px]">
                <!-- Dynamic List Items will be injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden py-10 flex flex-col items-center justify-center text-slate-400">
                <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-300"></i>
                <p class="text-xs">ไม่พบข้อมูลประวัติการทำงาน</p>
            </div>
        </div>
    </main>

    <!-- Simplified Custom Confirm Dialog (No Browser alert / confirm) -->
    <div id="custom-dialog" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 mx-4 transform transition-all scale-95 duration-200 text-center">
            <div class="flex items-center justify-center h-10 w-10 rounded-full bg-rose-50 text-rose-500 mx-auto mb-3">
                <i class="fa-solid fa-triangle-exclamation text-lg"></i>
            </div>
            <h3 class="text-md font-bold text-slate-900" id="dialog-title">ยืนยันรายการ</h3>
            <p class="text-slate-500 text-xs mt-1.5" id="dialog-message">คุณต้องการทำรายการนี้ใช่หรือไม่?</p>
            <div class="mt-4 flex items-center space-x-2">
                <button onclick="closeDialog()" class="w-1/2 py-2 border border-slate-200 text-slate-500 hover:bg-slate-50 font-semibold rounded-xl text-xs transition">
                    ยกเลิก
                </button>
                <button id="btn-dialog-confirm" class="w-1/2 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-xs transition">
                    ลบข้อมูล
                </button>
            </div>
        </div>
    </div>

    <!-- Small Toast System -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col space-y-1.5 pointer-events-none w-11/12 max-w-xs">
        <!-- Toast elements loaded dynamically -->
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration provided by user
        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-company-time-tracking';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let attendanceHistory = [];
        let todayRecord = null;
        let selectedShift = "normal";
        let userId = null;
        let isOnline = false;

        // Shift Configuration
        const shifts = {
            normal: { label: "กะปกติ", start: "09:00", end: "18:00" },
            early: { label: "กะเช้า", start: "08:00", end: "17:00" },
            late: { label: "กะบ่าย", start: "10:00", end: "19:00" }
        };

        // Expose functions globally for dynamic elements
        window.closeDialog = closeDialog;
        window.deleteRecord = deleteRecord;
        window.exportToCSV = exportToCSV;

        function loadLocalFallbackData() {
            const localData = localStorage.getItem('timesync_local_attendance');
            if (localData) {
                try {
                    attendanceHistory = JSON.parse(localData);
                } catch (e) {
                    attendanceHistory = [];
                }
            } else {
                attendanceHistory = [];
            }
            evaluateTodayState();
            renderLogs();
            renderKPIs();
        }

        function saveLocalDataAndRender() {
            localStorage.setItem('timesync_local_attendance', JSON.stringify(attendanceHistory));
            evaluateTodayState();
            renderLogs();
            renderKPIs();
        }

        window.onload = async function() {
            startClock();
            
            // Listen to shift change
            document.getElementById('shift-select').addEventListener('change', function(e) {
                selectedShift = e.target.value;
                showToast(`เลือก: ${shifts[selectedShift].label}`, "info");
                updateButtonAndStatusState();
            });

            // Punch button click
            document.getElementById('btn-punch-action').addEventListener('click', handlePunchAction);

            // Connect to Cloud with robust custom token & anonymous fallback
            try {
                let userCredential;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenErr) {
                        console.warn("Custom token mismatched/invalid. Falling back to Anonymous Auth...", tokenErr);
                        userCredential = await signInAnonymously(auth);
                    }
                } else {
                    userCredential = await signInAnonymously(auth);
                }
                userId = userCredential.user.uid;
                isOnline = true;
                
                // Update Name
                document.getElementById('header-user-name').innerText = "พนักงาน (ออนไลน์)";
                
                // Realtime listen to Firestore
                syncData();
            } catch (err) {
                console.error("Cloud Authentication failed entirely", err);
                showToast("ใช้ระบบออฟไลน์สำรอง: บันทึกจะถูกเก็บในเครื่อง", "warning");
                document.getElementById('header-user-name').innerText = "พนักงาน (ออฟไลน์)";
                
                isOnline = false;
                userId = "local_user_offline";
                loadLocalFallbackData();
            }
        };

        function startClock() {
            function update() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('live-time').innerText = `${hh}:${mm}:${ss}`;

                const formatOptions = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
                document.getElementById('live-date').innerText = now.toLocaleDateString('th-TH', formatOptions);
            }
            update();
            setInterval(update, 1000);
        }

        function syncData() {
            if (!userId) return;
            const q = collection(db, 'artifacts', appId, 'users', userId, 'attendance');
            
            onSnapshot(q, (snapshot) => {
                let list = [];
                snapshot.forEach(doc => {
                    list.push({ docId: doc.id, ...doc.data() });
                });

                // Sort descending in Javascript
                list.sort((a, b) => new Date(b.date) - new Date(a.date));
                attendanceHistory = list;
                
                evaluateTodayState();
                renderLogs();
                renderKPIs();
            }, (error) => {
                console.error("Firestore onSnapshot error", error);
                showToast("ดึงประวัติเรียลไทม์ไม่สำเร็จ", "error");
            });
        }

        function updateButtonAndStatusState() {
            const btn = document.getElementById('btn-punch-action');
            const icon = document.getElementById('btn-icon');
            const label = document.getElementById('btn-label');
            const statusText = document.getElementById('current-status-text');
            const todayInSpan = document.getElementById('today-in-time');
            const todayOutSpan = document.getElementById('today-out-time');

            if (!btn) return;

            // Reset styles for safe dynamic configuration
            btn.className = "w-full h-16 rounded-xl font-bold text-lg flex items-center justify-center space-x-3 transition shadow-md ios-active-tap";
            btn.disabled = false;
            icon.className = "fa-solid text-xl";

            if (!userId) {
                // Initial loading state
                btn.disabled = true;
                btn.classList.add("bg-slate-200", "text-slate-400", "cursor-not-allowed");
                icon.className = "fa-solid fa-spinner fa-spin text-xl";
                label.innerText = "กำลังโหลดข้อมูล...";
                statusText.innerText = "กำลังตรวจสอบข้อมูล...";
                statusText.className = "font-bold text-amber-300";
                todayInSpan.innerText = "-";
                todayOutSpan.innerText = "-";
                return;
            }

            if (!todayRecord) {
                // User hasn't checked in yet today
                btn.classList.add("bg-emerald-600", "hover:bg-emerald-700", "text-white");
                icon.className = "fa-solid fa-right-to-bracket";
                label.innerText = `เช็คอินเข้างาน (${shifts[selectedShift].label})`;
                statusText.innerText = "ยังไม่ได้เข้างาน";
                statusText.className = "font-bold text-amber-300";
                todayInSpan.innerText = "-";
                todayOutSpan.innerText = "-";
            } else if (todayRecord && !todayRecord.end) {
                // User checked in but has not checked out yet
                btn.classList.add("bg-rose-600", "hover:bg-rose-700", "text-white");
                icon.className = "fa-solid fa-right-from-bracket";
                label.innerText = "เช็คเอาต์ออกงาน";
                statusText.innerText = "กำลังปฏิบัติงาน";
                statusText.className = "font-bold text-emerald-400";
                todayInSpan.innerText = todayRecord.start;
                todayOutSpan.innerText = "-";
            } else {
                // Both check-in and check-out are complete
                btn.disabled = true;
                btn.classList.add("bg-slate-200", "text-slate-400", "cursor-not-allowed");
                icon.className = "fa-solid fa-circle-check text-slate-400";
                label.innerText = "บันทึกเวลาเรียบร้อยแล้ว";
                statusText.innerText = "เสร็จสิ้นการทำงานวันนี้";
                statusText.className = "font-bold text-indigo-300";
                todayInSpan.innerText = todayRecord.start;
                todayOutSpan.innerText = todayRecord.end;
            }
        }

        function evaluateTodayState() {
            const todayStr = new Date().toISOString().split('T')[0];
            todayRecord = attendanceHistory.find(item => item.date === todayStr) || null;
            updateButtonAndStatusState();
        }

        async function handlePunchAction() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const dateStr = now.toISOString().split('T')[0];

            if (isOnline) {
                if (!todayRecord) {
                    // Performing Check-In
                    const shiftStartLimit = shifts[selectedShift].start;
                    const limitMinutes = parseTime(shiftStartLimit);
                    const currentMinutes = parseTime(timeStr);
                    
                    const status = currentMinutes > limitMinutes ? "สาย" : "ตรงเวลา";

                    const newCheckIn = {
                        date: dateStr,
                        shift: selectedShift,
                        start: timeStr,
                        end: "",
                        hours: "0.00",
                        status: status
                    };

                    try {
                        await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'attendance'), newCheckIn);
                        showToast(status === "สาย" ? "บันทึกเช็คอิน (สาย)" : "เช็คอินเรียบร้อย เริ่มทำงานได้!", "success");
                    } catch (e) {
                        console.error("Checkin Error", e);
                        showToast("บันทึกเช็คอินล้มเหลว", "error");
                    }
                } else if (todayRecord && !todayRecord.end) {
                    // Performing Check-Out
                    const workingHours = calculateDiff(todayRecord.start, timeStr);
                    
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'users', userId, 'attendance', todayRecord.docId);
                        await updateDoc(docRef, {
                            end: timeStr,
                            hours: workingHours
                        });
                        showToast("บันทึกเช็คเอาต์เรียบร้อย ขอให้เดินทางกลับบ้านปลอดภัย!", "success");
                    } catch (e) {
                        console.error("Checkout Error", e);
                        showToast("บันทึกเช็คเอาต์ล้มเหลว", "error");
                    }
                }
            } else {
                // Offline fallback mode using localStorage
                if (!todayRecord) {
                    const shiftStartLimit = shifts[selectedShift].start;
                    const limitMinutes = parseTime(shiftStartLimit);
                    const currentMinutes = parseTime(timeStr);
                    const status = currentMinutes > limitMinutes ? "สาย" : "ตรงเวลา";

                    const newCheckIn = {
                        docId: "offline_" + Date.now(),
                        date: dateStr,
                        shift: selectedShift,
                        start: timeStr,
                        end: "",
                        hours: "0.00",
                        status: status
                    };

                    attendanceHistory.unshift(newCheckIn);
                    saveLocalDataAndRender();
                    showToast("บันทึกเช็คอินแบบออฟไลน์สำเร็จ", "success");
                } else if (todayRecord && !todayRecord.end) {
                    const workingHours = calculateDiff(todayRecord.start, timeStr);
                    todayRecord.end = timeStr;
                    todayRecord.hours = workingHours;
                    saveLocalDataAndRender();
                    showToast("บันทึกเช็คเอาต์แบบออฟไลน์สำเร็จ", "success");
                }
            }
        }

        function parseTime(timeStr) {
            const parts = timeStr.split(':').map(Number);
            return (parts[0] * 60) + parts[1];
        }

        function calculateDiff(start, end) {
            const sMins = parseTime(start);
            const eMins = parseTime(end);
            if (eMins <= sMins) return "0.00";
            return ((eMins - sMins) / 60).toFixed(2);
        }

        function renderKPIs() {
            const workedDays = attendanceHistory.length;
            document.getElementById('kpi-days').innerText = workedDays;

            let totalHrs = 0;
            let lateCounter = 0;

            attendanceHistory.forEach(item => {
                totalHrs += parseFloat(item.hours || 0);
                if (item.status === "สาย") {
                    lateCounter++;
                }
            });

            document.getElementById('kpi-hours').innerText = totalHrs.toFixed(1);
            document.getElementById('kpi-late').innerText = lateCounter;
        }

        function renderLogs() {
            const container = document.getElementById('logs-list');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = "";

            if (attendanceHistory.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            attendanceHistory.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs";

                const thaiDateStr = formatDateThai(item.date);
                const shiftLabel = shifts[item.shift]?.label || "ปกติ";
                
                const statusBadgeColor = item.status === "ตรงเวลา" 
                    ? "bg-emerald-50 text-emerald-700 border-emerald-100" 
                    : "bg-amber-50 text-amber-700 border-amber-100";

                row.innerHTML = `
                    <div class="flex flex-col space-y-0.5">
                        <span class="font-bold text-slate-800 text-[12px]">${thaiDateStr}</span>
                        <span class="text-[10px] text-slate-400 font-medium">${shiftLabel} • ${item.hours} ชม.</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <span class="block font-mono font-bold text-slate-700">${item.start} - ${item.end || '--:--'}</span>
                            <span class="inline-block px-1.5 py-0.5 mt-0.5 rounded border text-[9px] font-semibold ${statusBadgeColor}">${item.status}</span>
                        </div>
                        <button onclick="deleteRecord('${item.docId}')" class="text-rose-400 hover:text-rose-600 p-2 rounded-lg transition active:bg-rose-50 ios-active-tap">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function formatDateThai(dateStr) {
            const obj = new Date(dateStr);
            if (isNaN(obj.getTime())) return dateStr;
            const m = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${obj.getDate()} ${m[obj.getMonth()]} ${String(obj.getFullYear() + 543).slice(-2)}`;
        }

        let currentTargetId = null;
        function deleteRecord(id) {
            currentTargetId = id;
            document.getElementById('dialog-title').innerText = "ยืนยันการลบ";
            document.getElementById('dialog-message').innerText = "คุณแน่ใจหรือไม่ว่าต้องการลบรายการเวลานี้จากประวัติ?";
            
            document.getElementById('btn-dialog-confirm').onclick = executeDelete;
            document.getElementById('custom-dialog').classList.remove('hidden');
        }

        async function executeDelete() {
            if (!currentTargetId) return;
            
            if (isOnline && !currentTargetId.startsWith("offline_")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'attendance', currentTargetId));
                    showToast("ลบข้อมูลประวัติเรียบร้อย", "success");
                } catch (err) {
                    console.error("Error deleting doc", err);
                    showToast("ไม่สามารถลบข้อมูลจากระบบคลาวด์ได้", "error");
                } finally {
                    closeDialog();
                }
            } else {
                // Local deletion fallback
                attendanceHistory = attendanceHistory.filter(item => item.docId !== currentTargetId);
                saveLocalDataAndRender();
                showToast("ลบข้อมูลประวัติในเครื่องเรียบร้อย", "success");
                closeDialog();
            }
        }

        function closeDialog() {
            document.getElementById('custom-dialog').classList.add('hidden');
            currentTargetId = null;
        }

        function exportToCSV() {
            if (attendanceHistory.length === 0) {
                showToast("ไม่พบประวัติการตอกบัตรที่จะส่งออก", "warning");
                return;
            }

            let csv = "\ufeff";
            csv += "วันที่,กะปฏิบัติงาน,เวลาเช็คอิน,เวลาเช็คเอาต์,ชั่วโมงปฏิบัติงาน,สถานะ\n";

            attendanceHistory.forEach(item => {
                const shiftLabel = shifts[item.shift]?.label || "กะปกติ";
                csv += `"${item.date}","${shiftLabel}","${item.start}","${item.end || ''}","${item.hours}","${item.status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.setAttribute("href", url);
            anchor.setAttribute("download", `TimeSync_Report_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            showToast("ดาวน์โหลดไฟล์รายงาน CSV เรียบร้อย", "success");
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let styleClasses = 'bg-slate-900 text-white';
            let icon = 'fa-circle-info';

            if (type === 'success') {
                styleClasses = 'bg-emerald-600 text-white';
                icon = 'fa-circle-check';
            } else if (type === 'warning') {
                styleClasses = 'bg-amber-600 text-white';
                icon = 'fa-triangle-exclamation';
            } else if (type === 'error') {
                styleClasses = 'bg-rose-600 text-white';
                icon = 'fa-circle-exclamation';
            }

            toast.className = `${styleClasses} px-3 py-2 rounded-xl shadow-lg flex items-center space-x-2 text-xs transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span class="font-medium">${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>

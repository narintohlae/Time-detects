<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบพนักงาน - บนมือถือ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Style for bottom nav active state */
        .nav-btn { color: #9ca3af; transition: color 0.2s; }
        .nav-btn.active { color: #2563eb; }
        .nav-btn.active svg { stroke-width: 2.5; }
    </style>
</head>
<body class="h-screen w-full flex justify-center bg-gray-100 overflow-hidden">

    <!-- Message Box -->
    <div id="message-box" class="hidden fixed top-4 right-4 left-4 max-w-md mx-auto bg-white shadow-2xl border-l-4 p-4 rounded-2xl z-[60] transition-all duration-300">
        <p id="message-text" class="text-gray-800 font-medium"></p>
    </div>

    <!-- Conflict Warning Modal -->
    <div id="conflict-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center fade-in">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-100 mb-4">
                <svg class="h-8 w-8 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">ไม่สามารถส่งคำร้องได้</h3>
            <p id="conflict-msg" class="text-gray-600 mb-6 text-sm"></p>
            <button onclick="closeConflictModal()" class="w-full bg-gray-100 text-gray-800 font-bold py-3.5 rounded-xl active:scale-95 transition">ตกลง, ฉันเข้าใจแล้ว</button>
        </div>
    </div>

    <!-- 1. หน้า Login -->
    <div id="login-view" class="w-full max-w-md h-full bg-white flex flex-col fade-in relative">
        <div class="flex-1 flex flex-col justify-center px-8 pb-20">
            <div class="text-center mb-8">
                <div class="inline-block bg-blue-100 p-5 rounded-full mb-4">
                    <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">เข้าสู่ระบบ</h1>
                <p id="auth-status" class="text-sm text-gray-500 mt-2">กำลังตรวจสอบข้อมูล...</p>
            </div>

            <div class="space-y-5" id="login-form">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">1. เลือกชื่อของคุณ</label>
                    <select id="login-name" class="shadow-sm border border-gray-200 rounded-2xl w-full py-4 px-4 text-gray-700 leading-tight focus:ring-2 focus:ring-blue-500 bg-gray-50 text-lg outline-none">
                        <option value="">-- กำลังโหลด... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">2. รหัส PIN 4 หลัก</label>
                    <input type="password" id="login-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="****" class="shadow-sm border border-gray-200 rounded-2xl w-full py-4 px-4 text-center text-3xl tracking-[0.5em] bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" oninput="if(this.value.length===4) login();">
                </div>
                <button onclick="login()" id="btn-login" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 transition active:scale-95 mt-4 text-lg">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>
    </div>

    <!-- 2. หน้า Dashboard (ส่วนตัว) -->
    <div id="main-view" class="hidden w-full max-w-md h-full bg-gray-50 flex flex-col relative overflow-hidden">
        
        <!-- Header (Compact) -->
        <div class="bg-blue-600 px-6 py-5 text-white flex justify-between items-center shadow-sm z-10 rounded-b-3xl">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center mr-3 backdrop-blur-sm">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <h2 id="user-display-name" class="text-lg font-bold leading-tight">ชื่อพนักงาน</h2>
                    <p class="text-blue-200 text-xs">พร้อมใช้งาน</p>
                </div>
            </div>
            <button onclick="confirmLogout()" class="bg-blue-700/50 p-2.5 rounded-full active:scale-95 transition">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>

        <!-- Content Area (Scrollable with padding for bottom nav) -->
        <div class="flex-1 overflow-y-auto pb-24 px-5 pt-6 hide-scrollbar">
            
            <!-- Tab 1: ลงเวลา -->
            <div id="time-tab" class="block h-full flex flex-col fade-in">
                
                <!-- แผงสถานะประจำวัน -->
                <div id="today-status-panel" class="mb-5 p-5 rounded-3xl text-center border border-gray-100 bg-white shadow-sm transition-all duration-300">
                    <p class="text-gray-500 text-sm">กำลังโหลดสถานะ...</p>
                </div>

                <div class="text-center mb-6 mt-auto">
                    <h1 id="live-clock" class="text-6xl font-black text-gray-800 tracking-tight">00:00</h1>
                    <p id="live-date" class="text-blue-600 mt-2 text-sm font-medium"></p>
                </div>
                
                <div class="flex flex-col space-y-4 relative mt-auto">
                    <!-- Loading Overlay -->
                    <div id="btn-overlay" class="hidden absolute inset-0 z-10 bg-gray-50/50 backdrop-blur-sm rounded-3xl flex items-center justify-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-4 border-blue-600"></div>
                    </div>

                    <button onclick="recordTime('เข้างาน')" id="btn-in" class="w-full bg-emerald-500 text-white font-bold py-5 rounded-3xl shadow-xl shadow-emerald-500/20 active:scale-95 transition text-2xl flex items-center justify-center disabled:opacity-50">
                        <svg class="w-7 h-7 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        เข้างาน
                    </button>
                    <button onclick="recordTime('ออกงาน')" id="btn-out" class="w-full bg-rose-500 text-white font-bold py-5 rounded-3xl shadow-xl shadow-rose-500/20 active:scale-95 transition text-2xl flex items-center justify-center disabled:opacity-50">
                        <svg class="w-7 h-7 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        ออกงาน
                    </button>
                </div>
            </div>

            <!-- Tab 2: แจ้งลา/สลับวันหยุด -->
            <div id="request-tab" class="hidden fade-in">
                <!-- สรุปโควต้า -->
                <div class="bg-blue-600 p-5 rounded-3xl mb-5 shadow-lg shadow-blue-600/20 flex items-center justify-between text-white">
                    <div>
                        <p class="text-blue-100 text-xs font-medium">สิทธิ์ลาพัก/ป่วย/กิจ</p>
                        <p class="font-bold text-lg mt-0.5">ใช้ไป <span id="quota-used" class="text-2xl">0</span>/10 วัน</p>
                    </div>
                    <div id="quota-badge" class="bg-white/20 backdrop-blur-sm font-bold text-xs px-3 py-2 rounded-xl">
                        เหลือ 10 วัน
                    </div>
                </div>

                <!-- วันหยุดร้าน -->
                <div id="store-holidays-panel" class="bg-amber-100/50 border border-amber-200 p-4 rounded-3xl mb-5 hidden">
                    <p class="font-bold text-amber-800 text-sm mb-2 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        วันหยุดร้านประจำปี
                    </p>
                    <ul id="store-holidays-list" class="text-amber-700 text-xs space-y-1 ml-1"></ul>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1.5 ml-1">ประเภท</label>
                            <select id="reqType" onchange="toggleSwapDate()" class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-700">
                                <option value="ลากิจ">ลากิจ (ใช้โควต้า)</option>
                                <option value="ลาป่วย">ลาป่วย (ใช้โควต้า)</option>
                                <option value="ลาพักร้อน">ลาพักร้อน (ใช้โควต้า)</option>
                                <option value="สลับวันหยุด">สลับวันหยุด (ไม่ใช้โควต้า)</option>
                            </select>
                        </div>
                        <div>
                            <label id="reqDateLabel" class="block text-gray-700 text-xs font-bold mb-1.5 ml-1">วันที่ลา</label>
                            <input type="date" id="reqDate" class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-700">
                        </div>
                        <div id="swapDateField" class="hidden bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <label class="block text-blue-800 text-xs font-bold mb-1.5 ml-1">วันที่ทำแทน (ชดเชย)</label>
                            <input type="date" id="reqSwapDate" class="w-full bg-white border border-blue-200 py-3.5 px-4 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-700">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-xs font-bold mb-1.5 ml-1">เหตุผล</label>
                            <textarea id="reqReason" rows="2" class="w-full bg-gray-50 border border-gray-100 py-3.5 px-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-700" placeholder="ระบุเหตุผล..."></textarea>
                        </div>
                        <button onclick="submitRequest()" id="btn-submit-req" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition mt-2">
                            ส่งคำร้อง
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tab 3: ประวัติของฉัน -->
            <div id="history-tab" class="hidden fade-in flex flex-col h-full">
                <!-- Sub Tabs (Pills) -->
                <div class="flex bg-gray-200 p-1.5 rounded-2xl mb-5">
                    <button onclick="switchHistorySubTab('hist-time')" id="btn-hist-time" class="flex-1 py-2 text-sm font-bold rounded-xl bg-white shadow-sm text-blue-600 transition">ลงเวลา</button>
                    <button onclick="switchHistorySubTab('hist-req')" id="btn-hist-req" class="flex-1 py-2 text-sm font-bold rounded-xl text-gray-500 transition">คำร้อง</button>
                </div>
                
                <div id="hist-time" class="flex-1 space-y-3 block">
                    <div id="my-time-list" class="pb-4"></div>
                </div>

                <div id="hist-req" class="flex-1 space-y-3 hidden">
                    <div id="my-req-list" class="pb-4"></div>
                </div>
            </div>

        </div>

        <!-- 🌟 Bottom Navigation Bar (One-Handed UX) -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around items-center pb-safe pt-2 pb-3 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-20">
            <button onclick="switchTab('time-tab')" id="nav-time-tab" class="nav-btn active flex flex-col items-center w-1/3 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] font-bold">ลงเวลา</span>
            </button>
            <button onclick="switchTab('request-tab')" id="nav-request-tab" class="nav-btn flex flex-col items-center w-1/3 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] font-bold">แจ้งลา</span>
            </button>
            <button onclick="switchTab('history-tab')" id="nav-history-tab" class="nav-btn flex flex-col items-center w-1/3 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[10px] font-bold">ประวัติ</span>
            </button>
        </nav>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const isCanvas = typeof __app_id !== 'undefined';
        const canvasAppId = isCanvas ? __app_id : 'default-id';
        const getPath = (colName) => isCanvas ? `artifacts/${canvasAppId}/public/data/${colName}` : colName;

        let currentUser = null;
        let isReady = false;
        
        let employeesData = [];
        let allRequests = []; 
        let allTimeRecords = [];
        let storeHolidays = [];
        
        let loggedInEmp = null; 
        const MAX_LEAVE_DAYS = 10;
        let usedLeaveDays = 0;

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('live-date').textContent = now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        // UI Utils
        window.showMessage = function(msg, isError = false) {
            const box = document.getElementById('message-box');
            const text = document.getElementById('message-text');
            text.textContent = msg;
            box.className = `fixed top-4 right-4 left-4 max-w-md mx-auto shadow-2xl border-l-4 p-4 rounded-2xl z-[60] transition-all duration-300 ${isError ? 'bg-rose-50 border-rose-500 text-rose-800' : 'bg-emerald-50 border-emerald-500 text-emerald-800'}`;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        };

        window.switchTab = function(tabId) {
            // Hide all tabs
            ['time-tab', 'request-tab', 'history-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(`nav-${id}`).classList.remove('active');
            });
            // Show target
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            
            if(tabId === 'history-tab') renderMyHistory();
            
            if(tabId === 'request-tab') {
                const tmr = new Date();
                tmr.setDate(tmr.getDate() + 1);
                const tmrStr = tmr.toISOString().split('T')[0];
                document.getElementById('reqDate').value = tmrStr; // Default to tomorrow
                
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('reqDate').setAttribute('min', todayStr);
                document.getElementById('reqSwapDate').setAttribute('min', todayStr);
                
                updateLeaveQuotaUI();
            }
        };

        window.switchHistorySubTab = function(tabId) {
            document.getElementById('hist-time').classList.add('hidden');
            document.getElementById('hist-req').classList.add('hidden');
            document.getElementById('btn-hist-time').className = "flex-1 py-2 text-sm font-bold rounded-xl text-gray-500 transition";
            document.getElementById('btn-hist-req').className = "flex-1 py-2 text-sm font-bold rounded-xl text-gray-500 transition";
            
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "flex-1 py-2 text-sm font-bold rounded-xl bg-white shadow-sm text-blue-600 transition";
        };

        window.toggleSwapDate = function() {
            const reqType = document.getElementById('reqType').value;
            const swapDateField = document.getElementById('swapDateField');
            const reqDateLabel = document.getElementById('reqDateLabel');

            if (reqType === 'สลับวันหยุด') {
                swapDateField.classList.remove('hidden');
                reqDateLabel.textContent = "วันที่ต้องการหยุด (วันที่อยากหยุด)";
            } else {
                swapDateField.classList.add('hidden');
                reqDateLabel.textContent = "วันที่ลา";
                document.getElementById('reqSwapDate').value = ''; 
            }
        };

        window.closeConflictModal = function() {
            document.getElementById('conflict-modal').classList.add('hidden');
        };

        const formatDateFull = (timestamp) => {
            if (!timestamp) return { date: 'กำลังบันทึก...', time: '' };
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return {
                date: d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' }),
                time: d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };
        };

        const formatDisplayDate = (dateString) => {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        // Auth Init
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                document.getElementById('auth-status').textContent = "❌ เชื่อมต่อระบบล้มเหลว";
                document.getElementById('auth-status').classList.add("text-rose-500");
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isReady = true;
                document.getElementById('auth-status').innerHTML = '<span class="text-emerald-500 font-medium">พร้อมใช้งาน</span>';
                loadAllData();
            }
        });

        initAuth();

        function loadAllData() {
            if (!currentUser) return;
            
            onSnapshot(collection(db, getPath('employees')), (snapshot) => {
                employeesData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                employeesData.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                
                const select = document.getElementById('login-name');
                if(!loggedInEmp) {
                    select.innerHTML = employeesData.length > 0 
                        ? `<option value="">-- กรุณาเลือกชื่อของคุณ --</option>` + employeesData.map(emp => `<option value="${emp.name}">${emp.name}</option>`).join('')
                        : `<option value="">-- ไม่มีรายชื่อในระบบ --</option>`;
                }
                checkAutoLogin();
            }, console.error);

            onSnapshot(collection(db, getPath('store_holidays')), (snapshot) => {
                storeHolidays = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                storeHolidays.sort((a, b) => new Date(a.date) - new Date(b.date));
                updateStoreHolidaysUI();
            }, console.error);

            onSnapshot(collection(db, getPath('time_records')), (snapshot) => {
                allTimeRecords = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                allTimeRecords.sort((a, b) => {
                    const timeA = a.timestamp?.seconds || Number.MAX_SAFE_INTEGER;
                    const timeB = b.timestamp?.seconds || Number.MAX_SAFE_INTEGER;
                    return timeB - timeA;
                });
                
                if(loggedInEmp) {
                    renderMyHistory(); 
                    updateTodayStatus(); 
                }
            }, console.error);

            onSnapshot(collection(db, getPath('requests')), (snapshot) => {
                allRequests = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                allRequests.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                if(loggedInEmp) {
                    renderMyHistory(); 
                    updateLeaveQuotaUI();
                }
            }, console.error);
        }

        function updateStoreHolidaysUI() {
            const panel = document.getElementById('store-holidays-panel');
            const list = document.getElementById('store-holidays-list');
            
            if (storeHolidays.length === 0) {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            list.innerHTML = storeHolidays.map(h => 
                `<li>${formatDisplayDate(h.date)} : ${h.name}</li>`
            ).join('');
        }

        function updateLeaveQuotaUI() {
            if(!loggedInEmp) return;
            const currentYear = new Date().getFullYear().toString();
            
            const usedLeaves = allRequests.filter(r => 
                r.name === loggedInEmp.name && 
                r.status === 'อนุมัติแล้ว' && 
                r.date.startsWith(currentYear) &&
                (r.type === 'ลากิจ' || r.type === 'ลาป่วย' || r.type === 'ลาพักร้อน')
            );
            
            usedLeaveDays = usedLeaves.length;
            const remaining = MAX_LEAVE_DAYS - usedLeaveDays;

            document.getElementById('quota-used').textContent = usedLeaveDays;
            const badge = document.getElementById('quota-badge');
            
            if (remaining > 0) {
                badge.textContent = `เหลือ ${remaining} วัน`;
                badge.className = "bg-white/20 backdrop-blur-sm text-white font-bold text-xs px-3 py-2 rounded-xl";
            } else {
                badge.textContent = "หมดโควต้า";
                badge.className = "bg-rose-500 text-white font-bold text-xs px-3 py-2 rounded-xl shadow";
            }
        }

        function checkAutoLogin() {
            if (loggedInEmp) return; 
            const savedName = localStorage.getItem('myCompanyEmpName');
            const savedPin = localStorage.getItem('myCompanyEmpPin');
            
            if (savedName && savedPin) {
                const emp = employeesData.find(e => e.name === savedName && (e.pin || '1234') === savedPin);
                if (emp) {
                    processLoginSuccess(emp, false);
                } else {
                    localStorage.removeItem('myCompanyEmpName');
                    localStorage.removeItem('myCompanyEmpPin');
                }
            }
        }

        window.login = function() {
            const selectedName = document.getElementById('login-name').value;
            const pin = document.getElementById('login-pin').value;
            
            if(!selectedName) return showMessage("กรุณาเลือกชื่อของคุณก่อน", true);
            if(!pin || pin.length < 4) return showMessage("กรุณากรอกรหัส PIN ให้ครบ", true);

            const emp = employeesData.find(e => e.name === selectedName && (e.pin || '1234') === pin);
            
            if (emp) {
                localStorage.setItem('myCompanyEmpName', emp.name);
                localStorage.setItem('myCompanyEmpPin', emp.pin || '1234');
                processLoginSuccess(emp, true);
            } else {
                showMessage("รหัส PIN ไม่ถูกต้อง!", true);
                document.getElementById('login-pin').value = '';
            }
        };

        function processLoginSuccess(emp, showMsg = true) {
            loggedInEmp = emp;
            document.getElementById('user-display-name').textContent = loggedInEmp.name;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            
            switchTab('time-tab');
            updateTodayStatus(); 
            updateLeaveQuotaUI();
            
            document.getElementById('login-pin').value = '';
            if(showMsg) showMessage(`เข้าสู่ระบบเรียบร้อย`);
        }

        window.confirmLogout = function() {
            if(confirm("ออกจากระบบใช่หรือไม่?")) {
                localStorage.removeItem('myCompanyEmpName');
                localStorage.removeItem('myCompanyEmpPin');
                loggedInEmp = null;
                document.getElementById('main-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('login-name').value = '';
            }
        };

        window.updateTodayStatus = function() {
            if (!loggedInEmp) return;

            const panel = document.getElementById('today-status-panel');
            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');
            
            const todayStr = new Date().toLocaleDateString('th-TH');

            const myTodayRecords = allTimeRecords.filter(r => {
                if (r.name !== loggedInEmp.name) return false;
                if (!r.timestamp) return true; 
                const recDate = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                return recDate.toLocaleDateString('th-TH') === todayStr;
            });

            if (myTodayRecords.length === 0) {
                panel.className = "mb-5 p-5 rounded-3xl text-center border border-gray-100 bg-white shadow-sm";
                panel.innerHTML = `<p class="text-gray-500 font-bold text-lg">⚪️ ยังไม่ได้ลงเวลา</p>`;
                
                btnIn.disabled = false;
                btnOut.disabled = true;
                btnIn.classList.remove('hidden');
                btnOut.classList.add('hidden'); // ซ่อนปุ่มออกงาน
            } else {
                const latest = myTodayRecords[0];
                let timeStr = "...";
                if (latest.timestamp) {
                    const timeObj = latest.timestamp.toDate ? latest.timestamp.toDate() : new Date(latest.timestamp);
                    timeStr = timeObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
                }

                if (latest.type === 'เข้างาน') {
                    panel.className = "mb-5 p-5 rounded-3xl text-center border border-emerald-100 bg-emerald-50 shadow-sm";
                    panel.innerHTML = `<p class="text-emerald-700 font-bold text-lg">🟢 เข้างานแล้ว (${timeStr})</p>`;
                    
                    btnIn.disabled = true;
                    btnOut.disabled = false;
                    btnIn.classList.add('hidden'); // ซ่อนปุ่มเข้างาน
                    btnOut.classList.remove('hidden');
                } else if (latest.type === 'ออกงาน') {
                    panel.className = "mb-5 p-5 rounded-3xl text-center border border-rose-100 bg-rose-50 shadow-sm";
                    panel.innerHTML = `<p class="text-rose-700 font-bold text-lg">🔴 ออกงานแล้ว (${timeStr})</p>`;
                    
                    btnIn.disabled = true;
                    btnOut.disabled = true;
                    btnIn.classList.add('hidden');
                    btnOut.classList.remove('hidden');
                }
            }
        };

        window.renderMyHistory = function() {
            if (!loggedInEmp) return;

            const myTimes = allTimeRecords.filter(r => r.name === loggedInEmp.name);
            const timeList = document.getElementById('my-time-list');
            
            if (myTimes.length === 0) {
                timeList.innerHTML = `<div class="text-center text-gray-400 py-10">ไม่มีประวัติ</div>`;
            } else {
                timeList.innerHTML = myTimes.map(record => {
                    const dt = formatDateFull(record.timestamp);
                    return `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <div class="flex items-center">
                            <div class="w-2 h-10 rounded-full ${record.type === 'เข้างาน' ? 'bg-emerald-400' : 'bg-rose-400'} mr-3"></div>
                            <div>
                                <p class="text-xs text-gray-500 font-medium">${dt.date}</p>
                                <p class="text-lg font-bold text-gray-800">${dt.time}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 rounded-xl ${record.type === 'เข้างาน' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                            ${record.type}
                        </span>
                    </div>
                `}).join('');
            }

            const myReqs = allRequests.filter(req => req.name === loggedInEmp.name);
            const reqList = document.getElementById('my-req-list');

            if (myReqs.length === 0) {
                reqList.innerHTML = `<div class="text-center text-gray-400 py-10">ไม่มีประวัติ</div>`;
            } else {
                reqList.innerHTML = myReqs.map(req => {
                    let statusColor = 'bg-amber-50 text-amber-700 border-amber-100';
                    if (req.status === 'อนุมัติแล้ว') statusColor = 'bg-emerald-50 text-emerald-700 border-emerald-100';
                    if (req.status === 'ไม่อนุมัติ') statusColor = 'bg-rose-50 text-rose-700 border-rose-100';

                    let dateDisplay = `<span class="font-bold text-gray-600">หยุด:</span> ${formatDisplayDate(req.date)}`;
                    if (req.type === 'สลับวันหยุด' && req.swapDate) {
                        dateDisplay += `<br><span class="font-bold text-blue-500">แทน:</span> <span class="text-blue-600">${formatDisplayDate(req.swapDate)}</span>`;
                    }
                    const dt = formatDateFull(req.timestamp);

                    return `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="font-bold text-gray-800">${req.type}</span>
                                <span class="text-[10px] text-gray-400 block mt-0.5">ส่ง ${dt.date}</span>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-lg border ${statusColor}">
                                ${req.status}
                            </span>
                        </div>
                        <div class="text-xs text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100 mt-2 leading-relaxed">
                            ${dateDisplay} <br>
                            <span class="font-bold text-gray-500">เหตุ:</span> ${req.reason}
                        </div>
                    </div>
                    `;
                }).join('');
            }
        };

        window.recordTime = async function(type) {
            if (!isReady || !loggedInEmp) return;

            const todayStr = new Date().toLocaleDateString('th-TH');
            const myTodayRecords = allTimeRecords.filter(r => {
                if (r.name !== loggedInEmp.name) return false;
                if (!r.timestamp) return true; 
                const recDate = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                return recDate.toLocaleDateString('th-TH') === todayStr;
            });

            const latest = myTodayRecords.length > 0 ? myTodayRecords[0] : null;

            if (type === 'ออกงาน' && (!latest || latest.type !== 'เข้างาน')) return;
            if (type === 'เข้างาน' && latest && latest.type === 'เข้างาน') return;

            const overlay = document.getElementById('btn-overlay');
            overlay.classList.remove('hidden');

            try {
                await addDoc(collection(db, getPath('time_records')), {
                    name: loggedInEmp.name, 
                    type: type, 
                    timestamp: serverTimestamp(), 
                    userId: currentUser.uid
                });
                showMessage(`บันทึก${type} สำเร็จ!`);
            } catch (error) {
                showMessage("บันทึกข้อมูลล้มเหลว", true);
                overlay.classList.add('hidden');
            }
        };

        window.submitRequest = async function() {
            if (!isReady || !loggedInEmp) return;

            const reqType = document.getElementById('reqType').value;
            const reqDate = document.getElementById('reqDate').value;
            const reqReason = document.getElementById('reqReason').value.trim();
            const reqSwapDate = document.getElementById('reqSwapDate').value;

            if (!reqDate || !reqReason) return showMessage("กรุณากรอกข้อมูลให้ครบ", true);
            if (reqType === 'สลับวันหยุด' && !reqSwapDate) return showMessage("กรุณาระบุ 'วันที่มาทำแทน'", true);
            
            if ((reqType === 'ลากิจ' || reqType === 'ลาป่วย' || reqType === 'ลาพักร้อน') && usedLeaveDays >= MAX_LEAVE_DAYS) {
                document.getElementById('conflict-msg').innerHTML = `ใช้สิทธิ์ลาประจำปีครบกำหนด <span class="text-rose-600 font-bold">10 วัน</span> แล้ว`;
                document.getElementById('conflict-modal').classList.remove('hidden');
                return;
            }

            const conflictingRequest = allRequests.find(req => 
                req.date === reqDate && 
                req.name !== loggedInEmp.name &&
                (req.status === 'รออนุมัติ' || req.status === 'อนุมัติแล้ว')
            );

            if (conflictingRequest) {
                document.getElementById('conflict-msg').innerHTML = `มีคนลาวันที่ <span class="font-bold text-gray-800">${formatDisplayDate(reqDate)}</span> แล้ว (สถานะ: ${conflictingRequest.status})`;
                document.getElementById('conflict-modal').classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('btn-submit-req');
            const originalText = btn.innerHTML;
            btn.disabled = true; 
            btn.innerHTML = `<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>`;

            const requestData = {
                name: loggedInEmp.name, type: reqType, date: reqDate, reason: reqReason,
                status: 'รออนุมัติ', timestamp: serverTimestamp(), userId: currentUser.uid
            };
            if (reqType === 'สลับวันหยุด') requestData.swapDate = reqSwapDate; 

            try {
                await addDoc(collection(db, getPath('requests')), requestData);
                showMessage(`ส่งคำร้องสำเร็จ!`);
                document.getElementById('reqReason').value = '';
                document.getElementById('reqSwapDate').value = '';
                switchTab('history-tab');
                switchHistorySubTab('hist-req');
            } catch (error) {
                showMessage("ส่งคำร้องล้มเหลว", true);
            } finally {
                btn.disabled = false; btn.innerHTML = originalText;
            }
        };
    </script>
</body>
</html>

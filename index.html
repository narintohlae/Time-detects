<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาและคำร้องพนักงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        
        /* ซ่อน Scrollbar สำหรับเมนูแท็บแนวนอนบนมือถือ */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Message Box -->
    <div id="message-box" class="hidden fixed top-4 right-4 left-4 md:left-auto bg-white shadow-lg border-l-4 p-4 rounded z-50 transition-all duration-300">
        <p id="message-text" class="text-gray-800 font-medium"></p>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-xl shadow-md w-full max-w-md h-[600px] flex flex-col">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">ระบบพนักงาน</h1>
        
        <!-- Tabs -->
        <div class="flex border-b mb-6 overflow-x-auto hide-scrollbar whitespace-nowrap">
            <button onclick="switchTab('time-tab')" id="btn-time-tab" class="tab-btn active flex-1 px-4 py-2 text-center text-sm md:text-base text-gray-600 focus:outline-none">ลงเวลา</button>
            <button onclick="switchTab('request-tab')" id="btn-request-tab" class="tab-btn flex-1 px-4 py-2 text-center text-sm md:text-base text-gray-600 focus:outline-none">ส่งคำร้อง</button>
            <button onclick="switchTab('history-tab')" id="btn-history-tab" class="tab-btn flex-1 px-4 py-2 text-center text-sm md:text-base text-gray-600 focus:outline-none">สถานะคำร้อง</button>
        </div>

        <!-- เนื้อหา (ให้ขยายเต็มพื้นที่ที่เหลือและเลื่อนได้) -->
        <div class="flex-1 overflow-y-auto pr-1">
            
            <!-- Section 1: ลงเวลา -->
            <div id="time-tab" class="block h-full flex flex-col justify-center pb-10">
                <div class="mb-8">
                    <label class="block text-gray-700 text-sm font-bold mb-2">1. เลือกชื่อของคุณ</label>
                    <select id="employeeName" class="shadow border rounded-lg w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-lg">
                        <option value="">-- กำลังโหลดรายชื่อ... --</option>
                    </select>
                </div>
                
                <label class="block text-gray-700 text-sm font-bold mb-2">2. กดบันทึกเวลา</label>
                <div class="flex flex-col space-y-4">
                    <button onclick="recordTime('เข้างาน')" id="btn-in" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow transition duration-200 disabled:opacity-50 text-lg">
                        เข้างาน
                    </button>
                    <button onclick="recordTime('ออกงาน')" id="btn-out" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl shadow transition duration-200 disabled:opacity-50 text-lg">
                        ออกงาน
                    </button>
                </div>
            </div>

            <!-- Section 2: แจ้งลา/สลับวันหยุด -->
            <div id="request-tab" class="hidden">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">เลือกชื่อพนักงาน</label>
                    <select id="reqEmployeeName" class="shadow border rounded-lg w-full py-2 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- กรุณาเลือกชื่อ --</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทคำร้อง</label>
                    <select id="reqType" class="shadow border rounded-lg w-full py-2 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ลากิจ">ลากิจ</option>
                        <option value="ลาป่วย">ลาป่วย</option>
                        <option value="ลาพักร้อน">ลาพักร้อน</option>
                        <option value="สลับวันหยุด">สลับวันหยุด</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">วันที่ต้องการ (วันเริ่มต้น)</label>
                    <input type="date" id="reqDate" class="shadow border rounded-lg w-full py-2 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">เหตุผล / รายละเอียด</label>
                    <textarea id="reqReason" rows="3" class="shadow border rounded-lg w-full py-2 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ระบุเหตุผลที่ขอลา หรือวันที่ต้องการสลับ..."></textarea>
                </div>
                <button onclick="submitRequest()" id="btn-submit-req" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50">
                    ส่งคำร้อง
                </button>
            </div>

            <!-- Section 3: สถานะคำร้อง (ประวัติ) -->
            <div id="history-tab" class="hidden flex flex-col h-full">
                <div class="mb-4 sticky top-0 bg-white pt-2 pb-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">เลือกชื่อเพื่อดูประวัติ</label>
                    <select id="historyEmployeeName" onchange="renderHistory()" class="shadow border rounded-lg w-full py-2 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- กรุณาเลือกชื่อของคุณ --</option>
                    </select>
                </div>
                
                <div id="history-list" class="flex-1 space-y-3 pb-4">
                    <div class="text-center text-gray-500 mt-10 text-sm">
                        กรุณาเลือกชื่อของคุณเพื่อดูสถานะคำร้อง
                    </div>
                </div>
            </div>

        </div>

        <div id="status" class="mt-4 text-center text-xs font-medium">กำลังเชื่อมต่อ...</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const isCanvas = typeof __app_id !== 'undefined';
        const canvasAppId = isCanvas ? __app_id : 'default-id';
        const getPath = (colName) => isCanvas ? `artifacts/${canvasAppId}/public/data/${colName}` : colName;

        let currentUser = null;
        let isReady = false;
        let allRequests = []; // เก็บคำร้องทั้งหมดไว้กรองดูประวัติ

        // UI Utils
        window.showMessage = function(msg, isError = false) {
            const box = document.getElementById('message-box');
            const text = document.getElementById('message-text');
            text.textContent = msg;
            box.className = `fixed top-4 right-4 left-4 md:left-auto shadow-lg border-l-4 p-4 rounded z-50 transition-all duration-300 ${isError ? 'bg-red-50 border-red-500 text-red-700' : 'bg-green-50 border-green-500 text-green-700'}`;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        };

        window.switchTab = function(tabId) {
            ['time-tab', 'request-tab', 'history-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(`btn-${id}`).classList.remove('active');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).classList.add('active');

            // หากกดมาหน้าประวัติ ให้เรนเดอร์ข้อมูลเลย
            if(tabId === 'history-tab') {
                renderHistory();
            }
        };

        // Date Formatter
        const formatDate = (timestamp) => {
            if (!timestamp) return 'กำลังประมวลผล...';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
        };

        // Auth Init
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showMessage("เชื่อมต่อระบบล้มเหลว", true);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isReady = true;
                document.getElementById('status').textContent = "🟢 เชื่อมต่อระบบพร้อมใช้งาน";
                document.getElementById('status').className = "mt-4 text-center text-xs font-medium text-green-600";
                loadEmployees();
                loadRequests(); // โหลดข้อมูลคำร้องเพื่อใช้แสดงประวัติ
            }
        });

        initAuth();

        // 1. Load Employee Names
        function loadEmployees() {
            if (!currentUser) return;
            const selects = [
                document.getElementById('employeeName'),
                document.getElementById('reqEmployeeName'),
                document.getElementById('historyEmployeeName')
            ];
            
            onSnapshot(collection(db, getPath('employees')), (snapshot) => {
                let employees = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                employees.sort((a, b) => a.name.localeCompare(b.name, 'th'));

                const optionsHTML = employees.length > 0 
                    ? `<option value="">-- เลือกชื่อพนักงาน --</option>` + employees.map(emp => `<option value="${emp.name}">${emp.name}</option>`).join('')
                    : `<option value="">-- ไม่มีรายชื่อในระบบ --</option>`;
                
                // อัพเดท dropdown ทั้ง 3 จุด (โดยรักษาค่าเดิมที่เลือกไว้ถ้าเป็นไปได้)
                selects.forEach(select => {
                    const currentVal = select.value;
                    select.innerHTML = optionsHTML;
                    if(currentVal) select.value = currentVal;
                });
            }, (error) => console.error(error));
        }

        // 2. Load Requests for History
        function loadRequests() {
            if (!currentUser) return;
            onSnapshot(collection(db, getPath('requests')), (snapshot) => {
                allRequests = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                // เรียงจากใหม่ไปเก่า
                allRequests.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                // อัพเดทหน้าจอประวัติทันทีหากเปิดแท็บนั้นอยู่
                if(!document.getElementById('history-tab').classList.contains('hidden')) {
                    renderHistory();
                }
            }, (error) => console.error(error));
        }

        // 3. Render History List
        window.renderHistory = function() {
            const selectedName = document.getElementById('historyEmployeeName').value;
            const listContainer = document.getElementById('history-list');

            if (!selectedName) {
                listContainer.innerHTML = `<div class="text-center text-gray-500 mt-10 text-sm">กรุณาเลือกชื่อของคุณเพื่อดูสถานะคำร้อง</div>`;
                return;
            }

            // กรองข้อมูลเฉพาะของคนที่เลือก (Rule 2: Filter in memory)
            const myRequests = allRequests.filter(req => req.name === selectedName);

            if (myRequests.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-500 mt-10 text-sm bg-gray-50 p-4 rounded-lg">คุณยังไม่มีประวัติการส่งคำร้อง</div>`;
                return;
            }

            listContainer.innerHTML = myRequests.map(req => {
                // กำหนดสีของป้ายสถานะ
                let statusColor = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                if (req.status === 'อนุมัติแล้ว') statusColor = 'bg-green-100 text-green-800 border-green-200';
                if (req.status === 'ไม่อนุมัติ') statusColor = 'bg-red-100 text-red-800 border-red-200';

                return `
                <div class="bg-white border rounded-lg p-3 shadow-sm hover:shadow transition">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="font-bold text-gray-800">${req.type}</span>
                            <span class="text-xs text-gray-500 ml-2">ส่งเมื่อ: ${formatDate(req.timestamp)}</span>
                        </div>
                        <span class="text-xs font-semibold px-2 py-1 rounded-md border ${statusColor}">
                            ${req.status}
                        </span>
                    </div>
                    <div class="text-sm text-gray-700 bg-gray-50 p-2 rounded border border-gray-100">
                        <span class="font-semibold text-gray-600">วันที่ขอ:</span> ${req.date} <br>
                        <span class="font-semibold text-gray-600">เหตุผล:</span> ${req.reason}
                    </div>
                </div>
                `;
            }).join('');
        };

        // Actions
        window.recordTime = async function(type) {
            if (!isReady) return showMessage("ระบบกำลังเชื่อมต่อ...", true);

            const name = document.getElementById('employeeName').value;
            if (!name) return showMessage("กรุณาเลือกชื่อก่อนบันทึกเวลา!", true);

            const btnId = type === 'เข้างาน' ? 'btn-in' : 'btn-out';
            const btn = document.getElementById(btnId);
            btn.disabled = true; btn.innerHTML = "กำลังบันทึก...";

            try {
                await addDoc(collection(db, getPath('time_records')), {
                    name, type, timestamp: serverTimestamp(), userId: currentUser.uid
                });
                showMessage(`บันทึก${type}สำเร็จ!`);
                document.getElementById('employeeName').value = '';
            } catch (error) {
                showMessage("บันทึกข้อมูลล้มเหลว", true);
            } finally {
                btn.disabled = false; btn.innerHTML = type;
            }
        };

        window.submitRequest = async function() {
            if (!isReady) return;

            const name = document.getElementById('reqEmployeeName').value;
            const reqType = document.getElementById('reqType').value;
            const reqDate = document.getElementById('reqDate').value;
            const reason = document.getElementById('reqReason').value.trim();

            if (!name || !reqDate || !reason) return showMessage("กรุณากรอกข้อมูลให้ครบถ้วน!", true);

            const btn = document.getElementById('btn-submit-req');
            btn.disabled = true; btn.innerHTML = "กำลังส่ง...";

            try {
                await addDoc(collection(db, getPath('requests')), {
                    name, type: reqType, date: reqDate, reason,
                    status: 'รออนุมัติ', timestamp: serverTimestamp(), userId: currentUser.uid
                });
                showMessage(`ส่งคำร้องสำเร็จ!`);
                
                // เคลียร์ฟอร์ม
                document.getElementById('reqDate').value = '';
                document.getElementById('reqReason').value = '';
                
                // กำหนดชื่อในหน้าประวัติให้เป็นคนที่เพิ่งส่ง แล้วสลับไปหน้าประวัติให้ดูทันที
                document.getElementById('historyEmployeeName').value = name;
                switchTab('history-tab');
            } catch (error) {
                showMessage("ส่งคำร้องล้มเหลว", true);
            } finally {
                btn.disabled = false; btn.innerHTML = "ส่งคำร้อง";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาเข้า-ออกงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Message Box (แทน alert) -->
    <div id="message-box" class="hidden fixed top-4 right-4 left-4 md:left-auto bg-white shadow-lg border-l-4 p-4 rounded z-50 transition-all duration-300">
        <p id="message-text" class="text-gray-800 font-medium"></p>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">ระบบพนักงาน</h1>
        
        <!-- Tabs -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('time-tab')" id="btn-time-tab" class="tab-btn active flex-1 py-2 text-center text-gray-600 focus:outline-none">ลงเวลาทำงาน</button>
            <button onclick="switchTab('request-tab')" id="btn-request-tab" class="tab-btn flex-1 py-2 text-center text-gray-600 focus:outline-none">แจ้งลา/สลับวันหยุด</button>
        </div>

        <!-- Section 1: ลงเวลา -->
        <div id="time-tab" class="block">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">เลือกชื่อพนักงาน</label>
                <select id="employeeName" class="shadow border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50">
                    <option value="">-- กำลังโหลดรายชื่อ... --</option>
                </select>
            </div>
            
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <button onclick="recordTime('เข้างาน')" id="btn-in" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50">
                    เข้างาน
                </button>
                <button onclick="recordTime('ออกงาน')" id="btn-out" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50">
                    ออกงาน
                </button>
            </div>
        </div>

        <!-- Section 2: แจ้งลา/สลับวันหยุด -->
        <div id="request-tab" class="hidden">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">เลือกชื่อพนักงาน</label>
                <select id="reqEmployeeName" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-50">
                    <option value="">-- กรุณาเลือกชื่อ --</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทคำร้อง</label>
                <select id="reqType" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-50">
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลาป่วย">ลาป่วย</option>
                    <option value="ลาพักร้อน">ลาพักร้อน</option>
                    <option value="สลับวันหยุด">สลับวันหยุด</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">วันที่ต้องการ (วันเริ่มต้น)</label>
                <input type="date" id="reqDate" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-50">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">เหตุผล / รายละเอียด</label>
                <textarea id="reqReason" rows="3" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-gray-50" placeholder="ระบุเหตุผล..."></textarea>
            </div>
            <button onclick="submitRequest()" id="btn-submit-req" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50">
                ส่งคำร้อง
            </button>
        </div>

        <div id="status" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Helper สำหรับจัดการ Path ฐานข้อมูล (รองรับทั้ง Canvas และ Host ภายนอก)
        const isCanvas = typeof __app_id !== 'undefined';
        const canvasAppId = isCanvas ? __app_id : 'default-id';
        const getPath = (colName) => {
            return isCanvas ? `artifacts/${canvasAppId}/public/data/${colName}` : colName;
        };

        let currentUser = null;
        let isReady = false;

        // Custom Message Box Function
        window.showMessage = function(msg, isError = false) {
            const box = document.getElementById('message-box');
            const text = document.getElementById('message-text');
            text.textContent = msg;
            box.className = `fixed top-4 right-4 left-4 md:left-auto shadow-lg border-l-4 p-4 rounded z-50 transition-all duration-300 ${isError ? 'bg-red-50 border-red-500 text-red-700' : 'bg-green-50 border-green-500 text-green-700'}`;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        };

        // Authentication Setup
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showMessage("เชื่อมต่อระบบยืนยันตัวตนล้มเหลว", true);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isReady = true;
                document.getElementById('status').textContent = "🟢 เชื่อมต่อระบบพร้อมใช้งาน";
                document.getElementById('status').className = "mt-4 text-center text-sm font-medium text-green-600";
                loadEmployees(); // โหลดรายชื่อพนักงานเมื่อเชื่อมต่อสำเร็จ
            }
        });

        // Initialize
        initAuth();

        // Load Employees into Select Dropdowns
        function loadEmployees() {
            if (!currentUser) return;
            const selectTime = document.getElementById('employeeName');
            const selectReq = document.getElementById('reqEmployeeName');
            
            onSnapshot(collection(db, getPath('employees')), (snapshot) => {
                // Sorting client-side (Rule 2: No complex queries)
                let employees = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                employees.sort((a, b) => a.name.localeCompare(b.name, 'th'));

                const optionsHTML = employees.length > 0 
                    ? `<option value="">-- เลือกชื่อพนักงาน --</option>` + employees.map(emp => `<option value="${emp.name}">${emp.name} ${emp.position ? `(${emp.position})` : ''}</option>`).join('')
                    : `<option value="">-- ยังไม่มีรายชื่อในระบบ --</option>`;
                
                selectTime.innerHTML = optionsHTML;
                selectReq.innerHTML = optionsHTML;
            }, (error) => {
                console.error("Error loading employees: ", error);
            });
        }

        // Tab Switching Logic
        window.switchTab = function(tabId) {
            document.getElementById('time-tab').classList.add('hidden');
            document.getElementById('request-tab').classList.add('hidden');
            document.getElementById('btn-time-tab').classList.remove('active');
            document.getElementById('btn-request-tab').classList.remove('active');

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).classList.add('active');
        };

        // Record Time Function
        window.recordTime = async function(type) {
            if (!isReady || !currentUser) {
                showMessage("ระบบกำลังเชื่อมต่อ กรุณารอสักครู่", true);
                return;
            }

            const name = document.getElementById('employeeName').value.trim();
            if (!name) {
                showMessage("กรุณาเลือกชื่อพนักงานก่อนบันทึกเวลา!", true);
                return;
            }

            const btnId = type === 'เข้างาน' ? 'btn-in' : 'btn-out';
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.innerHTML = "กำลังบันทึก...";

            try {
                await addDoc(collection(db, getPath('time_records')), {
                    name: name,
                    type: type,
                    timestamp: serverTimestamp(),
                    userId: currentUser.uid
                });
                
                showMessage(`บันทึก${type} สำหรับคุณ ${name} สำเร็จ!`);
                document.getElementById('employeeName').value = '';
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage("เกิดข้อผิดพลาดในการบันทึกข้อมูล", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = type;
            }
        };

        // Submit Request Function
        window.submitRequest = async function() {
            if (!isReady || !currentUser) return;

            const name = document.getElementById('reqEmployeeName').value.trim();
            const reqType = document.getElementById('reqType').value;
            const reqDate = document.getElementById('reqDate').value;
            const reason = document.getElementById('reqReason').value.trim();

            if (!name || !reqDate || !reason) {
                showMessage("กรุณากรอกข้อมูลให้ครบถ้วน!", true);
                return;
            }

            const btn = document.getElementById('btn-submit-req');
            btn.disabled = true;
            btn.innerHTML = "กำลังส่ง...";

            try {
                await addDoc(collection(db, getPath('requests')), {
                    name: name,
                    type: reqType,
                    date: reqDate,
                    reason: reason,
                    status: 'รออนุมัติ',
                    timestamp: serverTimestamp(),
                    userId: currentUser.uid
                });
                
                showMessage(`ส่งคำร้อง ${reqType} สำเร็จ!`);
                document.getElementById('reqEmployeeName').value = '';
                document.getElementById('reqDate').value = '';
                document.getElementById('reqReason').value = '';
                switchTab('time-tab'); // กลับไปหน้าหลัก
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage("เกิดข้อผิดพลาดในการส่งคำร้อง", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "ส่งคำร้อง";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพนักงาน - บนมือถือ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-enter { animation: modalFadeIn 0.3s ease-out forwards; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Message Box -->
    <div id="message-box" class="hidden fixed top-4 right-4 left-4 md:left-auto bg-white shadow-xl border-l-4 p-4 rounded-xl z-50 transition-all duration-300">
        <p id="message-text" class="text-gray-800 font-medium"></p>
    </div>

    <!-- Conflict Warning Modal -->
    <div id="conflict-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-sm modal-enter text-center">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-100 mb-6">
                <svg class="h-8 w-8 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">ไม่สามารถส่งคำร้องได้</h3>
            <p id="conflict-msg" class="text-gray-600 mb-8 leading-relaxed"></p>
            <button onclick="closeConflictModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3.5 rounded-xl transition active:scale-95">
                ตกลง, ฉันเข้าใจแล้ว
            </button>
        </div>
    </div>

    <!-- 1. หน้า Login -->
    <div id="login-view" class="bg-white p-6 md:p-8 rounded-3xl shadow-lg w-full max-w-sm fade-in">
        <div class="text-center mb-8">
            <div class="inline-block bg-blue-100 p-4 rounded-full mb-4">
                <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">เข้าสู่ระบบ</h1>
            <p id="auth-status" class="text-sm text-gray-500 mt-2">กำลังตรวจสอบข้อมูล...</p>
        </div>

        <div class="space-y-5" id="login-form">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">1. เลือกชื่อของคุณ</label>
                <select id="login-name" class="shadow-sm border border-gray-200 rounded-xl w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-lg appearance-none">
                    <option value="">-- กำลังโหลดรายชื่อ... --</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">2. รหัส PIN 4 หลัก</label>
                <input type="password" id="login-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="****" class="shadow-sm border border-gray-200 rounded-xl w-full py-3 px-4 text-center text-2xl tracking-[0.5em] bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="if(this.value.length===4) login();">
            </div>
            <button onclick="login()" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition duration-200 mt-6 active:scale-95">
                ยืนยันเข้าสู่ระบบ
            </button>
        </div>
    </div>

    <!-- 2. หน้า Dashboard (ส่วนตัว) -->
    <div id="main-view" class="hidden bg-white rounded-3xl shadow-lg w-full max-w-md h-[750px] flex flex-col fade-in overflow-hidden relative border border-gray-100">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white rounded-t-3xl flex justify-between items-center shadow-md relative z-10">
            <div>
                <p class="text-blue-100 text-sm mb-0.5">สวัสดี,</p>
                <h2 id="user-display-name" class="text-xl font-bold">ชื่อพนักงาน</h2>
            </div>
            <button onclick="confirmLogout()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-xl text-sm font-medium transition flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                เปลี่ยนผู้ใช้
            </button>
        </div>
        
        <!-- Tabs -->
        <div class="flex border-b bg-gray-50 shadow-sm relative z-10">
            <button onclick="switchTab('time-tab')" id="btn-time-tab" class="tab-btn active flex-1 px-2 py-3 text-center text-sm font-medium text-gray-600 focus:outline-none">ลงเวลา</button>
            <button onclick="switchTab('request-tab')" id="btn-request-tab" class="tab-btn flex-1 px-2 py-3 text-center text-sm font-medium text-gray-600 focus:outline-none">ส่งคำร้อง</button>
            <button onclick="switchTab('history-tab')" id="btn-history-tab" class="tab-btn flex-1 px-2 py-3 text-center text-sm font-medium text-gray-600 focus:outline-none">ประวัติของฉัน</button>
        </div>

        <div class="flex-1 overflow-y-auto bg-gray-50/50 p-5">
            
            <!-- Tab 1: ลงเวลา -->
            <div id="time-tab" class="block h-full flex flex-col pb-6 fade-in">
                <div class="text-center mb-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mt-2">
                    <p class="text-gray-500 mb-1 font-medium">เวลาปัจจุบัน</p>
                    <h1 id="live-clock" class="text-5xl font-bold text-gray-800 tracking-wider">00:00</h1>
                    <p id="live-date" class="text-blue-600 mt-2 text-sm font-medium"></p>
                </div>

                <!-- แผงสถานะประจำวัน -->
                <div id="today-status-panel" class="mb-6 p-4 rounded-2xl text-center border border-gray-200 bg-gray-50 shadow-inner transition-all duration-300">
                    <p class="text-gray-500 text-sm">กำลังตรวจสอบสถานะ...</p>
                </div>
                
                <div class="flex flex-col space-y-4 mt-auto relative">
                    <!-- Loading Overlay ป้องกันการกดเบิ้ล -->
                    <div id="btn-overlay" class="hidden absolute inset-0 z-10 bg-white/50 backdrop-blur-sm rounded-2xl flex items-center justify-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-4 border-blue-600"></div>
                    </div>

                    <button onclick="recordTime('เข้างาน')" id="btn-in" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-6 rounded-2xl shadow-lg shadow-emerald-500/30 transition duration-300 text-2xl tracking-wide flex items-center justify-center active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-7 h-7 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        เข้างาน
                    </button>
                    <button onclick="recordTime('ออกงาน')" id="btn-out" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-6 rounded-2xl shadow-lg shadow-rose-500/30 transition duration-300 text-2xl tracking-wide flex items-center justify-center active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-7 h-7 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        ออกงาน
                    </button>
                </div>
            </div>

            <!-- Tab 2: แจ้งลา/สลับวันหยุด -->
            <div id="request-tab" class="hidden fade-in pb-8">
                
                <!-- สรุปสิทธิ์วันลา 10 วัน/ปี -->
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl mb-4 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-blue-800 font-bold text-sm">โควต้าลากิจ/ป่วย/พักร้อน ปีนี้</p>
                        <p class="text-xs text-blue-600 mt-0.5">ใช้สิทธิ์ไปแล้ว: <span id="quota-used" class="font-bold text-lg">0</span> / 10 วัน</p>
                    </div>
                    <div id="quota-badge" class="bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">
                        เหลือ 10 วัน
                    </div>
                </div>

                <!-- แจ้งเตือนวันหยุดร้าน -->
                <div id="store-holidays-panel" class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-2xl mb-4 hidden">
                    <p class="font-bold mb-1 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        วันหยุดประจำปีของร้าน
                    </p>
                    <ul id="store-holidays-list" class="list-disc list-inside text-amber-700 ml-1"></ul>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทคำร้อง</label>
                        <select id="reqType" onchange="toggleSwapDate()" class="shadow-sm border border-gray-200 rounded-xl w-full py-2.5 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ลากิจ">ลากิจ (ใช้โควต้า)</option>
                            <option value="ลาป่วย">ลาป่วย (ใช้โควต้า)</option>
                            <option value="ลาพักร้อน">ลาพักร้อน (ใช้โควต้า)</option>
                            <option value="สลับวันหยุด">สลับวันหยุด (ไม่ใช้โควต้า)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label id="reqDateLabel" class="block text-gray-700 text-sm font-bold mb-2">วันที่ต้องการหยุด (วันที่ลา)</label>
                        <input type="date" id="reqDate" class="shadow-sm border border-gray-200 rounded-xl w-full py-2.5 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div id="swapDateField" class="mb-4 hidden fade-in bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <label class="block text-blue-800 text-sm font-bold mb-2">วันที่จะมาทำงานแทน (วันชดเชย)</label>
                        <input type="date" id="reqSwapDate" class="shadow-sm border border-blue-200 rounded-xl w-full py-2.5 px-3 text-gray-700 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">เหตุผล / รายละเอียด</label>
                        <textarea id="reqReason" rows="3" class="shadow-sm border border-gray-200 rounded-xl w-full py-2.5 px-3 text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ระบุเหตุผล..."></textarea>
                    </div>
                    <button onclick="submitRequest()" id="btn-submit-req" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition duration-200 active:scale-95 flex justify-center items-center">
                        ส่งคำร้อง
                    </button>
                </div>
            </div>

            <!-- Tab 3: ประวัติของฉัน -->
            <div id="history-tab" class="hidden fade-in flex flex-col h-full">
                <div class="flex bg-gray-200/80 p-1 rounded-xl mb-4">
                    <button onclick="switchHistorySubTab('hist-time')" id="btn-hist-time" class="flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow-sm text-blue-600 transition">ประวัติลงเวลา</button>
                    <button onclick="switchHistorySubTab('hist-req')" id="btn-hist-req" class="flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition">ประวัติคำร้อง</button>
                </div>
                
                <div id="hist-time" class="flex-1 space-y-3 pb-4 block">
                    <div id="my-time-list"></div>
                </div>

                <div id="hist-req" class="flex-1 space-y-3 pb-4 hidden">
                    <div id="my-req-list"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const isCanvas = typeof __app_id !== 'undefined';
        const canvasAppId = isCanvas ? __app_id : 'default-id';
        const getPath = (colName) => isCanvas ? `artifacts/${canvasAppId}/public/data/${colName}` : colName;

        let currentUser = null;
        let isReady = false;
        
        let employeesData = [];
        let allRequests = []; 
        let allTimeRecords = [];
        let storeHolidays = [];
        
        let loggedInEmp = null; 
        const MAX_LEAVE_DAYS = 10;
        let usedLeaveDays = 0;

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('live-date').textContent = now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        // UI Utils
        window.showMessage = function(msg, isError = false) {
            const box = document.getElementById('message-box');
            const text = document.getElementById('message-text');
            text.textContent = msg;
            box.className = `fixed top-4 right-4 left-4 md:left-auto shadow-2xl border-l-4 p-4 rounded-xl z-50 transition-all duration-300 ${isError ? 'bg-rose-50 border-rose-500 text-rose-800' : 'bg-emerald-50 border-emerald-500 text-emerald-800'}`;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        };

        window.switchTab = function(tabId) {
            ['time-tab', 'request-tab', 'history-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(`btn-${id}`).classList.remove('active');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).classList.add('active');
            
            if(tabId === 'history-tab') renderMyHistory();
            
            if(tabId === 'request-tab') {
                const tmr = new Date();
                tmr.setDate(tmr.getDate() + 1);
                const tmrStr = tmr.toISOString().split('T')[0];
                document.getElementById('reqDate').value = tmrStr;
                
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('reqDate').setAttribute('min', todayStr);
                document.getElementById('reqSwapDate').setAttribute('min', todayStr);
                
                updateLeaveQuotaUI();
            }
        };

        window.switchHistorySubTab = function(tabId) {
            document.getElementById('hist-time').classList.add('hidden');
            document.getElementById('hist-req').classList.add('hidden');
            document.getElementById('btn-hist-time').className = "flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition";
            document.getElementById('btn-hist-req').className = "flex-1 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-700 transition";
            
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "flex-1 py-1.5 text-sm font-bold rounded-lg bg-white shadow-sm text-blue-600 transition";
        };

        window.toggleSwapDate = function() {
            const reqType = document.getElementById('reqType').value;
            const swapDateField = document.getElementById('swapDateField');
            const reqDateLabel = document.getElementById('reqDateLabel');

            if (reqType === 'สลับวันหยุด') {
                swapDateField.classList.remove('hidden');
                reqDateLabel.textContent = "วันที่ต้องการขอหยุด (วันที่อยากหยุด)";
            } else {
                swapDateField.classList.add('hidden');
                reqDateLabel.textContent = "วันที่ต้องการหยุด (วันที่ลา)";
                document.getElementById('reqSwapDate').value = ''; 
            }
        };

        window.closeConflictModal = function() {
            document.getElementById('conflict-modal').classList.add('hidden');
        };

        const formatDateFull = (timestamp) => {
            if (!timestamp) return { date: 'กำลังบันทึก...', time: '' };
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return {
                date: d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' }),
                time: d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };
        };

        const formatDisplayDate = (dateString) => {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
        };

        // Auth Init
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                document.getElementById('auth-status').textContent = "❌ เชื่อมต่อระบบล้มเหลว";
                document.getElementById('auth-status').classList.add("text-rose-500");
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isReady = true;
                document.getElementById('auth-status').innerHTML = '<span class="text-emerald-500 font-medium">พร้อมใช้งาน</span>';
                loadAllData();
            }
        });

        initAuth();

        function loadAllData() {
            if (!currentUser) return;
            
            onSnapshot(collection(db, getPath('employees')), (snapshot) => {
                employeesData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                employeesData.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                
                const select = document.getElementById('login-name');
                if(!loggedInEmp) {
                    select.innerHTML = employeesData.length > 0 
                        ? `<option value="">-- กรุณาเลือกชื่อของคุณ --</option>` + employeesData.map(emp => `<option value="${emp.name}">${emp.name}</option>`).join('')
                        : `<option value="">-- ไม่มีรายชื่อในระบบ --</option>`;
                }
                checkAutoLogin();
            }, console.error);

            // โหลดวันหยุดร้าน
            onSnapshot(collection(db, getPath('store_holidays')), (snapshot) => {
                storeHolidays = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                storeHolidays.sort((a, b) => new Date(a.date) - new Date(b.date));
                updateStoreHolidaysUI();
            }, console.error);

            onSnapshot(collection(db, getPath('time_records')), (snapshot) => {
                allTimeRecords = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                // เรียงจากใหม่ไปเก่า โดยให้ที่ไม่มี timestamp (เพิ่งกด) อยู่บนสุด
                allTimeRecords.sort((a, b) => {
                    const timeA = a.timestamp?.seconds || Number.MAX_SAFE_INTEGER;
                    const timeB = b.timestamp?.seconds || Number.MAX_SAFE_INTEGER;
                    return timeB - timeA;
                });
                
                if(loggedInEmp) {
                    renderMyHistory(); 
                    updateTodayStatus(); 
                }
            }, console.error);

            onSnapshot(collection(db, getPath('requests')), (snapshot) => {
                allRequests = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                allRequests.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                if(loggedInEmp) {
                    renderMyHistory(); 
                    updateLeaveQuotaUI();
                }
            }, console.error);
        }

        function updateStoreHolidaysUI() {
            const panel = document.getElementById('store-holidays-panel');
            const list = document.getElementById('store-holidays-list');
            
            if (storeHolidays.length === 0) {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            list.innerHTML = storeHolidays.map(h => 
                `<li>${formatDisplayDate(h.date)} : ${h.name}</li>`
            ).join('');
        }

        function updateLeaveQuotaUI() {
            if(!loggedInEmp) return;
            const currentYear = new Date().getFullYear().toString();
            
            // นับเฉพาะคำร้องที่ "อนุมัติแล้ว" ของปีนี้ และเป็นประเภทที่ตัดโควต้า
            const usedLeaves = allRequests.filter(r => 
                r.name === loggedInEmp.name && 
                r.status === 'อนุมัติแล้ว' && 
                r.date.startsWith(currentYear) &&
                (r.type === 'ลากิจ' || r.type === 'ลาป่วย' || r.type === 'ลาพักร้อน')
            );
            
            usedLeaveDays = usedLeaves.length;
            const remaining = MAX_LEAVE_DAYS - usedLeaveDays;

            document.getElementById('quota-used').textContent = usedLeaveDays;
            const badge = document.getElementById('quota-badge');
            
            if (remaining > 0) {
                badge.textContent = `เหลือ ${remaining} วัน`;
                badge.className = "bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg";
            } else {
                badge.textContent = "สิทธิ์หมดแล้ว";
                badge.className = "bg-rose-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow";
            }
        }

        function checkAutoLogin() {
            if (loggedInEmp) return; 
            const savedName = localStorage.getItem('myCompanyEmpName');
            const savedPin = localStorage.getItem('myCompanyEmpPin');
            
            if (savedName && savedPin) {
                const emp = employeesData.find(e => e.name === savedName && (e.pin || '1234') === savedPin);
                if (emp) {
                    processLoginSuccess(emp, false);
                } else {
                    localStorage.removeItem('myCompanyEmpName');
                    localStorage.removeItem('myCompanyEmpPin');
                }
            }
        }

        window.login = function() {
            const selectedName = document.getElementById('login-name').value;
            const pin = document.getElementById('login-pin').value;
            
            if(!selectedName) return showMessage("กรุณาเลือกชื่อของคุณก่อน", true);
            if(!pin || pin.length < 4) return showMessage("กรุณากรอกรหัส PIN ให้ครบ 4 หลัก", true);

            const emp = employeesData.find(e => e.name === selectedName && (e.pin || '1234') === pin);
            
            if (emp) {
                localStorage.setItem('myCompanyEmpName', emp.name);
                localStorage.setItem('myCompanyEmpPin', emp.pin || '1234');
                processLoginSuccess(emp, true);
            } else {
                showMessage("รหัส PIN ไม่ถูกต้อง!", true);
                document.getElementById('login-pin').value = '';
            }
        };

        function processLoginSuccess(emp, showMsg = true) {
            loggedInEmp = emp;
            document.getElementById('user-display-name').textContent = loggedInEmp.name;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            
            switchTab('time-tab');
            updateTodayStatus(); 
            updateLeaveQuotaUI();
            
            document.getElementById('login-pin').value = '';
            if(showMsg) showMessage(`ยินดีต้อนรับคุณ ${loggedInEmp.name}`);
        }

        window.confirmLogout = function() {
            if(confirm("คุณต้องการเปลี่ยนบัญชีผู้ใช้ใช่หรือไม่?")) {
                localStorage.removeItem('myCompanyEmpName');
                localStorage.removeItem('myCompanyEmpPin');
                loggedInEmp = null;
                document.getElementById('main-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('login-name').value = '';
            }
        };

        window.updateTodayStatus = function() {
            if (!loggedInEmp) return;

            const panel = document.getElementById('today-status-panel');
            const btnIn = document.getElementById('btn-in');
            const btnOut = document.getElementById('btn-out');
            
            const todayStr = new Date().toLocaleDateString('th-TH');

            const myTodayRecords = allTimeRecords.filter(r => {
                if (r.name !== loggedInEmp.name) return false;
                if (!r.timestamp) return true; 
                const recDate = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                return recDate.toLocaleDateString('th-TH') === todayStr;
            });

            if (myTodayRecords.length === 0) {
                panel.className = "mb-6 p-4 rounded-2xl text-center border border-gray-200 bg-gray-50 shadow-inner transition-all duration-300";
                panel.innerHTML = `<p class="text-gray-600 font-bold text-lg">⚪️ วันนี้ยังไม่ได้ลงเวลา</p><p class="text-gray-500 text-sm mt-1">กรุณากดปุ่ม "เข้างาน"</p>`;
                
                btnIn.disabled = false;
                btnOut.disabled = true;
            } else {
                const latest = myTodayRecords[0];
                let timeStr = "กำลังบันทึก...";
                if (latest.timestamp) {
                    const timeObj = latest.timestamp.toDate ? latest.timestamp.toDate() : new Date(latest.timestamp);
                    timeStr = timeObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
                }

                if (latest.type === 'เข้างาน') {
                    panel.className = "mb-6 p-4 rounded-2xl text-center border border-emerald-200 bg-emerald-50 shadow-sm transition-all duration-300";
                    panel.innerHTML = `<p class="text-emerald-700 font-bold text-lg">🟢 วันนี้เข้างานแล้ว</p><p class="text-emerald-600 font-medium text-sm mt-1">เมื่อเวลา ${timeStr}</p>`;
                    
                    btnIn.disabled = true;
                    btnOut.disabled = false;
                } else if (latest.type === 'ออกงาน') {
                    panel.className = "mb-6 p-4 rounded-2xl text-center border border-rose-200 bg-rose-50 shadow-sm transition-all duration-300";
                    panel.innerHTML = `<p class="text-rose-700 font-bold text-lg">🔴 วันนี้ออกงานแล้ว</p><p class="text-rose-600 font-medium text-sm mt-1">เมื่อเวลา ${timeStr}</p>`;
                    
                    btnIn.disabled = true;
                    btnOut.disabled = true;
                }
            }
        };

        window.renderMyHistory = function() {
            if (!loggedInEmp) return;

            const myTimes = allTimeRecords.filter(r => r.name === loggedInEmp.name);
            const timeList = document.getElementById('my-time-list');
            
            if (myTimes.length === 0) {
                timeList.innerHTML = `<div class="text-center text-gray-500 py-8 bg-white rounded-2xl shadow-sm border border-gray-100">ยังไม่มีประวัติการลงเวลา</div>`;
            } else {
                timeList.innerHTML = myTimes.map(record => {
                    const dt = formatDateFull(record.timestamp);
                    return `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <div class="flex items-center">
                            <div class="w-3 h-12 rounded-full ${record.type === 'เข้างาน' ? 'bg-emerald-400' : 'bg-rose-400'} mr-4 shrink-0"></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">${dt.date}</p>
                                <p class="text-xl font-bold text-gray-800">${dt.time} <span class="text-sm font-normal">น.</span></p>
                            </div>
                        </div>
                        <span class="text-sm font-bold px-4 py-1.5 rounded-full ${record.type === 'เข้างาน' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} whitespace-nowrap">
                            ${record.type}
                        </span>
                    </div>
                `}).join('');
            }

            const myReqs = allRequests.filter(req => req.name === loggedInEmp.name);
            const reqList = document.getElementById('my-req-list');

            if (myReqs.length === 0) {
                reqList.innerHTML = `<div class="text-center text-gray-500 py-8 bg-white rounded-2xl shadow-sm border border-gray-100">ยังไม่มีประวัติการส่งคำร้อง</div>`;
            } else {
                reqList.innerHTML = myReqs.map(req => {
                    let statusColor = 'bg-amber-100 text-amber-700 border-amber-200';
                    if (req.status === 'อนุมัติแล้ว') statusColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    if (req.status === 'ไม่อนุมัติ') statusColor = 'bg-rose-100 text-rose-700 border-rose-200';

                    let dateDisplay = `<span class="font-bold text-gray-500">วันที่ขอหยุด:</span> <span class="font-medium">${formatDisplayDate(req.date)}</span>`;
                    
                    if (req.type === 'สลับวันหยุด' && req.swapDate) {
                        dateDisplay += `<br><span class="font-bold text-blue-500">วันที่มาทำแทน:</span> <span class="font-medium text-blue-700">${formatDisplayDate(req.swapDate)}</span>`;
                    }
                    const dt = formatDateFull(req.timestamp);

                    return `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="font-bold text-gray-800 text-lg">${req.type}</span>
                                <span class="text-xs text-gray-500 ml-2 block sm:inline mt-1 sm:mt-0 font-medium">ส่ง: ${dt.date}</span>
                            </div>
                            <span class="text-xs font-bold px-3 py-1.5 rounded-lg border ${statusColor}">
                                ${req.status}
                            </span>
                        </div>
                        <div class="text-sm text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100 leading-relaxed">
                            ${dateDisplay} <br>
                            <span class="font-bold text-gray-500">เหตุผล:</span> <span class="font-medium">${req.reason}</span>
                        </div>
                    </div>
                    `;
                }).join('');
            }
        };

        window.recordTime = async function(type) {
            if (!isReady || !loggedInEmp) return showMessage("ไม่พบข้อมูลผู้ใช้งาน", true);

            // Double Protection Logic
            const todayStr = new Date().toLocaleDateString('th-TH');
            const myTodayRecords = allTimeRecords.filter(r => {
                if (r.name !== loggedInEmp.name) return false;
                if (!r.timestamp) return true; 
                const recDate = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                return recDate.toLocaleDateString('th-TH') === todayStr;
            });

            const latest = myTodayRecords.length > 0 ? myTodayRecords[0] : null;

            if (type === 'ออกงาน' && (!latest || latest.type !== 'เข้างาน')) {
                return showMessage("คุณยังไม่ได้กด 'เข้างาน' สำหรับวันนี้ครับ", true);
            }
            if (type === 'เข้างาน' && latest && latest.type === 'เข้างาน') {
                return showMessage("คุณได้เข้างานไปแล้ว ไม่สามารถกดซ้ำได้", true);
            }

            // Lock UI
            const overlay = document.getElementById('btn-overlay');
            overlay.classList.remove('hidden');

            try {
                await addDoc(collection(db, getPath('time_records')), {
                    name: loggedInEmp.name, 
                    type: type, 
                    timestamp: serverTimestamp(), 
                    userId: currentUser.uid
                });
                
                showMessage(`บันทึกเวลา${type} สำเร็จ!`);
                // UI จะถูกปลดล็อกและอัปเดตอัตโนมัติจาก onSnapshot
            } catch (error) {
                showMessage("บันทึกข้อมูลล้มเหลว กรุณาลองใหม่", true);
                overlay.classList.add('hidden'); // ปลดล็อกถ้าพัง
            }
        };

        window.submitRequest = async function() {
            if (!isReady || !loggedInEmp) return;

            const reqType = document.getElementById('reqType').value;
            const reqDate = document.getElementById('reqDate').value;
            const reqReason = document.getElementById('reqReason').value.trim();
            const reqSwapDate = document.getElementById('reqSwapDate').value;

            if (!reqDate || !reqReason) return showMessage("กรุณากรอกวันที่และเหตุผลให้ครบถ้วน", true);
            if (reqType === 'สลับวันหยุด' && !reqSwapDate) return showMessage("กรุณาระบุ 'วันที่จะมาทำงานแทน'", true);
            if (reqType === 'สลับวันหยุด' && reqDate === reqSwapDate) return showMessage("วันที่ขอหยุดกับวันที่มาทำงานแทน ต้องไม่ใช่วันเดียวกัน", true);

            // เช็คโควต้าวันลา
            if ((reqType === 'ลากิจ' || reqType === 'ลาป่วย' || reqType === 'ลาพักร้อน') && usedLeaveDays >= MAX_LEAVE_DAYS) {
                document.getElementById('conflict-msg').innerHTML = `คุณใช้สิทธิ์ลาประจำปีครบกำหนด <span class="text-rose-600 font-bold">10 วัน</span> แล้ว <br>หากมีเหตุจำเป็นฉุกเฉิน กรุณาติดต่อผู้จัดการโดยตรงครับ`;
                document.getElementById('conflict-modal').classList.remove('hidden');
                return;
            }

            // เช็ควันชนกันกับคนอื่น
            const conflictingRequest = allRequests.find(req => 
                req.date === reqDate && 
                req.name !== loggedInEmp.name &&
                (req.status === 'รออนุมัติ' || req.status === 'อนุมัติแล้ว')
            );

            if (conflictingRequest) {
                document.getElementById('conflict-msg').innerHTML = `ในวันที่ <span class="font-bold text-gray-800">${formatDisplayDate(reqDate)}</span> <br>มีเพื่อนพนักงานจองวันหยุดไปแล้ว (สถานะ: <span class="text-rose-600 font-semibold">${conflictingRequest.status}</span>)<br>กรุณาเลือกวันอื่นครับ`;
                document.getElementById('conflict-modal').classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('btn-submit-req');
            const originalText = btn.innerHTML;
            btn.disabled = true; 
            btn.innerHTML = `<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>`;

            const requestData = {
                name: loggedInEmp.name, 
                type: reqType, 
                date: reqDate, 
                reason: reqReason,
                status: 'รออนุมัติ', 
                timestamp: serverTimestamp(), 
                userId: currentUser.uid
            };

            if (reqType === 'สลับวันหยุด') {
                requestData.swapDate = reqSwapDate; 
            }

            try {
                await addDoc(collection(db, getPath('requests')), requestData);
                showMessage(`ส่งคำร้องสำเร็จ!`);
                
                document.getElementById('reqReason').value = '';
                document.getElementById('reqSwapDate').value = '';
                
                switchTab('history-tab');
                switchHistorySubTab('hist-req');
            } catch (error) {
                showMessage("ส่งคำร้องล้มเหลว", true);
            } finally {
                btn.disabled = false; 
                btn.innerHTML = originalText;
            }
        };
    </script>
</body>
</html>
